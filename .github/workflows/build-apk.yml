name: Build ASERVER APK v1.5.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR=""

          # The source may be uploaded extracted, nested in ASERVER/, or as a ZIP.
          for ARCHIVE in \
            ASERVER-v1.5.1-SHAREDPREFERENCES-FIX.zip \
            ASERVER-v1.5.1-SOURCE.zip \
            ASERVER-v1.5.0-GITHUB-BUILD-FIX.zip \
            ASERVER-v1.5.0-VIVO-FIX.zip \
            ASERVER-Android-Project.zip; do
            if [ -f "$ARCHIVE" ]; then
              mkdir -p .aserver-build-src
              unzip -q -o "$ARCHIVE" -d .aserver-build-src
              break
            fi
          done

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f -name settings.gradle \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)
          if [ -n "$SETTINGS_FILE" ]; then
            SOURCE_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          fi

          if [ -z "$SOURCE_DIR" ] || [ ! -f "$SOURCE_DIR/build.gradle" ] || [ ! -f "$SOURCE_DIR/app/build.gradle" ]; then
            echo "Proyek Android ASERVER tidak ditemukan. Ekstrak isi source ke root repo atau unggah ZIP source yang didukung." >&2
            find . -maxdepth 4 -type f \( -name settings.gradle -o -name build.gradle \) -print
            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Android project ditemukan di: $SOURCE_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Explicit packages avoid the removed legacy SDK package named "tools".
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify Android project root
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          echo "Building ASERVER from: $(pwd)"
          gradle --version

      - name: Build debug APK
        run: cd "$SOURCE_DIR" && gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASERVER-debug-APK-v1.5.1
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
