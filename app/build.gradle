}

android {
    namespace 'id.rk.aserver'
    compileSdk 35

    defaultConfig {
        applicationId 'id.rk.aserver'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.5.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
